server:
  port: 0 # 0 表示随机端口，避免与其它程序冲突
  address: localhost # 仅监听回环地址，局域网内其它主机无法访问
  servlet:
    session:
      tracking-modes: COOKIE # 仅用 Cookie 跟踪会话，避免会话 ID 出现在 URL 中
      cookie:
        same-site: strict
        http-only: true
        # 名字不写死在这里：由 ClientApplication#configureSessionCookieName 按登入用户派生，
        # 保证“同一用户重启用同一个名字、不同用户不同名字”（cookie 不区分端口，同名会互相覆盖）

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/e2echo_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
