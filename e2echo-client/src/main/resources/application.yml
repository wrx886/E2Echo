server:
  port: 0 # 0 表示随机端口，避免与其它程序冲突
  address: localhost # 仅监听回环地址，局域网内其它主机无法访问
  servlet:
    session:
      tracking-modes: COOKIE # 仅用 Cookie 跟踪会话，避免会话 ID 出现在 URL 中
      cookie:
        same-site: strict
        http-only: true
        # 每个实例一个独立的 cookie 名：cookie 不区分端口，多个实例都跑在 localhost 上时，
        # 同名的会话 cookie 会互相覆盖，导致后登入的实例把前面实例的会话挤掉
        name: E2ECHO_SESSION_${random.uuid}

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/e2echo_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
