server:
  port: 0 # 0 表示随机端口，避免与其它程序冲突
  address: localhost # 仅监听回环地址，局域网内其它主机无法访问
  servlet:
    session:
      tracking-modes: COOKIE # 仅用 Cookie 跟踪会话，避免会话 ID 出现在 URL 中
      cookie:
        same-site: strict
        http-only: true

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/e2echo_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true